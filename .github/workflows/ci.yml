name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Tool lists agree
        run: python3 scripts/check_tool_agreement.py
      - name: No account identifier in the tree
        run: python3 scripts/scan_identifiers.py .

  secrets:
    # Every commit reachable in the repository, not only the pushed range: a
    # credential removed from the tip is still in every clone. Accepted findings
    # are declared by fingerprint in .gitleaksignore; no path is exempt.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: No secret anywhere in the history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" .'
